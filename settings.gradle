pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net' }
    }
}

rootProject.name = 'DLC-Manager'

includeBuild('architectury/1.20.1') {
    name = 'arch1201'
}

includeBuild('architectury/1.21.1') {
    name = 'arch1211'
}

includeBuild('helper/file-ops-helper') {
    name = 'fileOpsHelperRoot'
    dependencySubstitution {
        substitute module('com.cozooo.dlc_fileops_helper:dlc-fileops-helper') using project(':')
    }
}
