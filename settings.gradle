pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            url = 'https://maven.kikugie.dev/snapshots'
            name = 'KikuGie Snapshots'
        }
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net' }
    }
}

plugins {
    id('dev.kikugie.stonecutter') version '0.9.6'
}

rootProject.name = 'DLC-Manager'

stonecutter {
    kotlinController = false
    centralScript = 'stonecutter.gradle'

    create('stonecutter') {
        version '1.20.1', '1.20.1'
        version '1.21.1', '1.21.1'
        vcsVersion = '1.21.1'
        mapBuilds { branch, node -> 'stonecutter-node.gradle' }
    }
}

include ':common'

includeBuild('architectury/1.20.1') {
    name = 'arch1201'
}

includeBuild('architectury/1.21.1') {
    name = 'arch1211'
}

includeBuild('tools/dlc-javafx-manager') {
    name = 'dlcJavafxManager'
}
