plugins {
    id 'architectury-plugin'
    id 'dev.architectury.loom'
    id 'com.gradleup.shadow'
    id 'org.jetbrains.kotlin.jvm' apply false
    id 'maven-publish'
}

if (!rootProject.extensions.extraProperties.has('configureDlcStonecutterBase')) {
    apply from: rootProject.file('build.gradle'), to: rootProject
}
apply from: rootProject.file("${project.parent.name}/stonecutter-node.gradle")
