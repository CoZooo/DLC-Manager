plugins {
    id 'java-library'
    id 'maven-publish'
}

group = providers.gradleProperty('mod_group').get()
version = providers.gradleProperty('mod_version').get()

base {
    archivesName = 'dlc-fileops-helper'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java.srcDirs = ['common/src/main/java']
        resources.srcDirs = ['common/src/main/resources']
    }
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://maven.cozozjw.cn/repository/maven-public/')
    }
}

dependencies {
    implementation "com.google.code.gson:gson:2.10.1"
    compileOnly "org.slf4j:slf4j-api:2.0.13"
}

tasks.register('helperBuild') {
    group = 'build'
    dependsOn(tasks.named('build'))
}

tasks.register('helperCheck') {
    group = 'verification'
    dependsOn(tasks.named('check'))
}

tasks.register('helperClean') {
    group = 'build'
    dependsOn(tasks.named('clean'))
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'dlc-fileops-helper'
            version = project.version
        }
    }

    repositories {
        maven {
            name = 'CozoooNexus'
            url = uri('https://maven.cozozjw.cn/repository/maven-releases/')
            credentials {
                username = findProperty('mavenUsername') ?: System.getenv('MAVEN_USERNAME')
                password = findProperty('mavenPassword') ?: System.getenv('MAVEN_PASSWORD')
            }
        }
    }
}
