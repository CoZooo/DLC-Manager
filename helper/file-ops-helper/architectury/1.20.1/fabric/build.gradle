plugins {
    id 'architectury-plugin'
    id 'dev.architectury.loom'
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

sourceSets {
    main {
        java.srcDir '../../../fabric/1.20.1/src/main/java'
        resources.srcDir '../../../fabric/1.20.1/src/main/resources'
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}

processResources {
    inputs.properties([
        mod_id: rootProject.mod_id,
        mod_name: rootProject.mod_name,
        mod_version: rootProject.mod_version,
        mod_author: rootProject.mod_author,
        mc_version_range: rootProject.minecraft_version_range,
        fabric_loader_version: rootProject.fabric_loader_version,
        java_version: rootProject.java_version,
        pack_format: rootProject.pack_format
    ])

    filesMatching('fabric.mod.json') {
        expand([
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_version: rootProject.mod_version,
            mod_author: rootProject.mod_author,
            mc_version_range: rootProject.minecraft_version_range,
            fabric_loader_version: rootProject.fabric_loader_version,
            java_version: rootProject.java_version
        ])
    }

    filesMatching('pack.mcmeta') {
        expand([pack_format: rootProject.pack_format])
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile = shadowJar.archiveFile
    dependsOn shadowJar
    archiveFileName.set("DLC-FileOps-Helper-fabric-${rootProject.minecraft_version}-${rootProject.mod_version}.jar")
    destinationDirectory.set(rootProject.layout.projectDirectory.dir("../../output/${rootProject.findProperty('mod_version') ?: '0.0.0'}"))
}

jar {
    archiveClassifier = 'dev'
}
