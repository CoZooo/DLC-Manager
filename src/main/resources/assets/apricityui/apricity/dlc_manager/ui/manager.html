<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="aui-viewport" content="mode=browser,width=1120,zoom=1,min-zoom=1,max-zoom=1,user-scalable=false">
    <meta name="aui-mouse-events" content="intercept">
    <link rel="stylesheet" href="manager.css">
    <title>DLC Manager</title>
</head>
<body class="dlc-manager-ui">
    <main id="manager" class="manager" data-sidebar-width="172" data-row-height="40">
        <aside id="manager-sidebar" class="sidebar">
            <div id="sidebar-content" class="sidebar-content">
                <div class="brand-emblem" aria-hidden="true">
                    <span class="brand-chest"></span>
                </div>
                <h1 id="manager-title" class="brand">DLC Manager</h1>
                <div id="category-label" class="section-label"></div>
                <nav id="manager-filters" aria-labelledby="category-label"></nav>
                <div class="sidebar-tools">
                    <div class="sidebar-divider"></div>
                    <div id="tools-label" class="section-label"></div>
                    <nav id="manager-tools" aria-labelledby="tools-label"></nav>
                </div>
            </div>
        </aside>
        <section class="workspace">
            <header id="manager-header" class="workspace-header">
                <div class="workspace-heading">
                    <div id="manager-connection"></div>
                </div>
            </header>
            <div class="list-toolbar">
                <div id="sidebar-toggle-slot"></div>
                <div class="search-field">
                    <input id="manager-search" type="search" autocomplete="off">
                    <div id="search-actions"></div>
                </div>
                <span id="manager-summary"></span>
                <div id="batch-actions"></div>
                <nav id="manager-context" aria-label="DLC actions"></nav>
            </div>
            <div id="manager-list" role="list" tabindex="0"></div>
            <footer class="workspace-footer">
                <div id="manager-mode"></div>
                <span id="pending-status" role="status"></span>
                <div id="manager-actions"></div>
            </footer>
        </section>
    </main>
</body>
</html>
