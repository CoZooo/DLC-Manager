<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="aui-viewport" content="mode=browser,width=1120,user-scalable=false">
    <meta name="aui-mouse-events" content="intercept">
    <link rel="stylesheet" href="manager.css">
    <link rel="stylesheet" href="page.css">
    <title>DLC</title>
</head>
<body class="dlc-manager-ui">
    <main class="page-shell">
        <header class="page-header">
            <div id="page-back"></div>
            <div class="page-heading">
                <h1 id="page-title"></h1>
                <p id="page-subhead"></p>
            </div>
            <nav id="page-toolbar"></nav>
        </header>
        <div id="page-content" tabindex="0"></div>
        <footer class="page-footer">
            <div id="page-leading-actions"></div>
            <span id="page-status" role="status" aria-live="polite"></span>
            <div id="page-actions"></div>
        </footer>
    </main>
</body>
</html>
