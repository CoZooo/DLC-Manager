modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="PolyForm-Shield-1.0.0"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/dlc_manager/textures/gui/icon.png"
authors="${mod_author}"
displayTest="IGNORE_SERVER_VERSION"
description='''
${mod_description}
'''

[modproperties.${mod_id}]
curseforgeProjectId="${curseforge_project_id}"
modrinthProjectId="${modrinth_project_id}"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_loader_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${forge_minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="architectury"
mandatory=true
versionRange="[0,)"
ordering="NONE"
side="BOTH"
${kotlin_for_forge_dependency}

[[dependencies.${mod_id}]]
modId="apricityui"
mandatory=true
versionRange="[${apricity_ui_version},)"
ordering="AFTER"
side="CLIENT"
