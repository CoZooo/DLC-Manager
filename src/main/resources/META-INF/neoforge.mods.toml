side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="architectury"
mandatory=true
versionRange="[0,)"
ordering="NONE"
side="BOTH"
${kotlin_for_forge_dependency}

[[dependencies.${mod_id}]]
modId="mafglib"
mandatory=true
versionRange="${mafglib_version_range}"
ordering="NONE"
side="CLIENT"
