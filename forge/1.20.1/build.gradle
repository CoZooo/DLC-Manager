plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.+'
}

def commonProject = project(':common')

group = mod_group
version = mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java.srcDir commonProject.file('src/main/java')
        resources.srcDir commonProject.file('src/main/resources')
    }
}

def forgeMcVersion = project.findProperty('mc_version') ?: '1.20.1'
def forgeVersion = project.findProperty('forge_version') ?: ''
def forgePackFormat = project.findProperty('pack_format')

minecraft {
    mappings channel: 'official', version: forgeMcVersion

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
            mods {
                dlc_manager {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = "https://cursemaven.com" }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forgeMcVersion}-${forgeVersion}"
    implementation project(':common')
    implementation fg.deobf("curse.maven:mafglib-910766:${project.findProperty('mafglib_curse_file')}")
}

tasks.named('processResources', ProcessResources).configure {
    inputs.properties([
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_author: mod_author,
        mc_version: forgeMcVersion,
        forge_loader_version_range: project.findProperty('forge_loader_version_range'),
        forge_minecraft_version_range: project.findProperty('forge_minecraft_version_range'),
        mafglib_version_range: project.findProperty('mafglib_version_range')
    ])
    filesMatching('META-INF/mods.toml') {
        expand([
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_author: mod_author,
            mc_version: forgeMcVersion,
            forge_loader_version_range: project.findProperty('forge_loader_version_range'),
            forge_minecraft_version_range: project.findProperty('forge_minecraft_version_range'),
            mafglib_version_range: project.findProperty('mafglib_version_range')
        ])
    }
    filesMatching('pack.mcmeta') {
        expand([
            pack_format: forgePackFormat
        ])
    }
}

def loaderName = project.findProperty("loader_name") ?: "forge"

jar {
    archiveFileName.set("DLC-Manager-${loaderName}-${forgeMcVersion}-${mod_version}.jar")
    manifest {
        attributes([
            'Specification-Title'     : mod_name,
            'Specification-Vendor'    : mod_author,
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_name,
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : mod_author
        ])
    }
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "forge-${forgeMcVersion}"
            artifact jar
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/CoZooo/DLC-Manager")
            credentials {
                username = System.getenv("USERNAME") ?: (project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR"))
                password = System.getenv("TOKEN") ?: (project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN"))
            }
        }
        maven {
            name = "LocalBuildRepo"
            url = uri("${project.buildDir}/repo")
        }
    }
}
