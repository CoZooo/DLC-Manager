rootProject.configureDlcStonecutterBase(project)

def commonProjectPath = ":common:${project.name}"
def commonProject = project(commonProjectPath)
def commonJar = commonProject.tasks.named('jar').flatMap { it.archiveFile }
def commonForgeJar = commonProject.tasks.named('transformProductionForge').flatMap { it.archiveFile }
def kotlinSourcesEnabled = rootProject.architecturyBooleanProperty(project, 'enable_kotlin', false)
    && plugins.hasPlugin('org.jetbrains.kotlin.jvm')

architectury {
    platformSetupLoomIde()
    forge()
}

rootProject.configureDlcStonecutterSources(project)
rootProject.configureLocalDevMods(project)
rootProject.configureServerRunClientOnlyModExcludes(project, commonProjectPath)

def withoutOwnDevJar = { File file ->
    !file.toPath().startsWith(layout.buildDirectory.dir('devlibs').get().asFile.toPath())
}

tasks.named('compileJava').configure {
    classpath = classpath.filter(withoutOwnDevJar)
}

if (tasks.findByName('compileKotlin') != null) {
    tasks.named('compileKotlin').configure {
        libraries.setFrom(libraries.filter(withoutOwnDevJar))
    }
}

afterEvaluate {
    tasks.named('compileJava').configure {
        setDependsOn(dependsOn.findAll { it != tasks.named('jar').get() })
    }
    if (tasks.findByName('compileKotlin') != null) {
        tasks.named('compileKotlin').configure {
            setDependsOn(dependsOn.findAll { it != tasks.named('jar').get() })
        }
    }
}

loom {
    forge {
        convertAccessWideners = true
    }
}

configurations {
    common
    shadowCommon
    kotlinForForgeModDiscovery
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

def kotlinForForgeDiscoveryJar = layout.buildDirectory.file("kotlinForForgeModDiscovery/kotlinforforge-all.jar")
def prepareKotlinForForgeModDiscovery = tasks.register('prepareKotlinForForgeModDiscovery', Copy) {
    from(configurations.kotlinForForgeModDiscovery)
    into(kotlinForForgeDiscoveryJar.map { it.asFile.parentFile })
    rename { 'kotlinforforge-all.jar' }
}

if (kotlinSourcesEnabled) {
    tasks.matching {
        it.name == 'generateDLIConfig' || it.name == 'runClient' || it.name == 'runServer'
    }.configureEach {
        dependsOn prepareKotlinForForgeModDiscovery
    }
}

loom {
    mods {
        dlc_manager {
            sourceSet sourceSets.main
        }
        if (kotlinSourcesEnabled) {
            kotlinforforge {
                getModFiles().from(files(kotlinForForgeDiscoveryJar).builtBy(prepareKotlinForForgeModDiscovery))
            }
        }
    }
}

dependencies {
    forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    modImplementation "dev.architectury:architectury-forge:${project.architectury_api_version}"
    if (kotlinSourcesEnabled) {
        modImplementation "thedarkcolour:kotlinforforge:${project.kotlin_for_forge_version}"
        kotlinForForgeModDiscovery("thedarkcolour:kotlinforforge:${project.kotlin_for_forge_version}:all") {
            transitive = false
        }
    }
    modImplementation "curse.maven:mafglib-910766:${project.mafglib_curse_file}"
    include(implementation("com.cozooo.dlc_manager:dlc-fileops-helper:${file_ops_helper_version}"))
    include(implementation("org.commonmark:commonmark:0.21.0"))
    include(implementation("org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0"))
    forgeRuntimeLibrary "com.cozooo.dlc_manager:dlc-fileops-helper:${file_ops_helper_version}"
    forgeRuntimeLibrary "org.commonmark:commonmark:0.21.0"
    forgeRuntimeLibrary "org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0"

    common(files(commonJar).builtBy(commonProject.tasks.named('jar')))
    shadowCommon(files(commonForgeJar).builtBy(commonProject.tasks.named('transformProductionForge')))
}

processResources {
    def kotlinForForgeDependency = kotlinSourcesEnabled ? """
[[dependencies.${rootProject.mod_id}]]
modId="kotlinforforge"
mandatory=true
versionRange="${project.kotlin_for_forge_version_range}"
ordering="NONE"
side="BOTH"
""" : ""
    inputs.properties([
        mod_id: rootProject.mod_id,
        mod_name: rootProject.mod_name,
        mod_version: rootProject.mod_version,
        mod_author: rootProject.mod_author,
        mc_version: project.minecraft_version,
        forge_loader_version_range: project.forge_loader_version_range,
        forge_minecraft_version_range: project.forge_minecraft_version_range,
        kotlin_for_forge_dependency: kotlinForForgeDependency,
        mafglib_version_range: project.mafglib_version_range,
        pack_format: project.pack_format
    ])

    doLast { task ->
        rootProject.expandProcessedResource(task, 'META-INF/mods.toml', [
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_version: rootProject.mod_version,
            mod_author: rootProject.mod_author,
            mc_version: project.minecraft_version,
            forge_loader_version_range: project.forge_loader_version_range,
            forge_minecraft_version_range: project.forge_minecraft_version_range,
            kotlin_for_forge_dependency: kotlinForForgeDependency,
            mafglib_version_range: project.mafglib_version_range
        ])
        rootProject.expandProcessedResource(task, 'pack.mcmeta', [pack_format: project.pack_format])
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile = shadowJar.archiveFile
    dependsOn shadowJar
    archiveFileName.set("DLC-Manager-forge-${project.minecraft_version}-${rootProject.mod_version}.jar")
    destinationDirectory.set(rootProject.layout.projectDirectory.dir("output/${rootProject.findProperty('mod_version') ?: '0.0.0'}"))
}

jar {
    archiveClassifier = 'dev'
}

tasks.register('exportObfClasspath', Sync) {
    dependsOn("${commonProjectPath}:jar")
    from({
        def jars = [] as LinkedHashSet<File>
        [configurations.compileClasspath, configurations.runtimeClasspath].each { cfg ->
            jars.addAll(cfg.resolve().findAll { it.name.endsWith('.jar') })
        }
        jars
    })
    into rootProject.layout.projectDirectory.dir("obf-lib/forge-${project.minecraft_version}")
}
