plugins {
    id 'architectury-plugin'
    id 'dev.architectury.loom'
    id 'com.gradleup.shadow'
}

def kotlinEnabled = rootProject.architecturyBooleanProperty(project, 'enable_kotlin', false)
def kotlinExcludeJavaCompile = kotlinEnabled && rootProject.architecturyBooleanProperty(project, 'kotlin_exclude_java_compile', false)
def kotlinMainDirs = [
    '../../../forge/src/main/kotlin',
    '../../../forge/1.20.1/src/main/kotlin'
]
def javaMainDirs = [
    '../../../forge/src/main/java',
    '../../../forge/1.20.1/src/main/java'
]
def moduleProject = project
def kotlinForForgeVersion = rootProject.kotlin_for_forge_version

architectury {
    platformSetupLoomIde()
    forge()
}

sourceSets {
    main {
        java.srcDirs = kotlinExcludeJavaCompile ? [] : javaMainDirs
        if (kotlinEnabled) {
            kotlin.srcDirs = kotlinMainDirs
            if (!kotlinExcludeJavaCompile) {
                java.exclude rootProject.javaSourcesReplacedByKotlin(project, kotlinMainDirs)
            }
        }
        resources.srcDir '../../../forge/1.20.1/src/main/resources'
    }
}

if (kotlinEnabled) {
    tasks.named('compileKotlin').configure {
        if (!kotlinExcludeJavaCompile) {
            source(sourceSets.main.java)
        }
    }
    if (kotlinExcludeJavaCompile) {
        tasks.named('compileJava').configure {
            enabled = false
        }
        tasks.named('jar').configure {
            doFirst {
                rootProject.clearMainJavaClasses(moduleProject)
            }
        }
    } else {
        tasks.named('compileJava').configure {
            doFirst {
                rootProject.deleteJavaClassesReplacedByKotlin(moduleProject, kotlinMainDirs, destinationDirectory.get().asFile)
            }
        }
        tasks.named('jar').configure {
            doFirst {
                rootProject.deleteJavaClassesReplacedByKotlin(moduleProject, kotlinMainDirs, tasks.named('compileJava').get().destinationDirectory.get().asFile)
            }
        }
    }
} else {
    tasks.named('compileJava').configure {
        doFirst {
            rootProject.deleteKotlinClassesReplacedByJava(moduleProject, kotlinMainDirs, layout.buildDirectory.dir('classes/kotlin/main').get().asFile)
        }
    }
    tasks.named('jar').configure {
        doFirst {
            rootProject.deleteKotlinClassesReplacedByJava(moduleProject, kotlinMainDirs, layout.buildDirectory.dir('classes/kotlin/main').get().asFile)
        }
    }
}

rootProject.configureReplacementClassSync(moduleProject, kotlinEnabled, kotlinMainDirs, kotlinExcludeJavaCompile)
rootProject.configureLocalDevMods(moduleProject)
rootProject.configureServerRunClientOnlyModExcludes(moduleProject)

loom {
    forge {
        convertAccessWideners = true
    }
}

configurations {
    common
    shadowCommon
    kotlinForForgeModDiscovery
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

def kotlinForForgeDiscoveryJar = layout.buildDirectory.file("kotlinForForgeModDiscovery/kotlinforforge-all.jar")
def prepareKotlinForForgeModDiscovery = tasks.register('prepareKotlinForForgeModDiscovery', Copy) {
    from(configurations.kotlinForForgeModDiscovery)
    into(kotlinForForgeDiscoveryJar.map { it.asFile.parentFile })
    rename { 'kotlinforforge-all.jar' }
}

if (kotlinEnabled) {
    tasks.matching {
        it.name == 'generateDLIConfig' || it.name == 'runClient' || it.name == 'runServer'
    }.configureEach {
        dependsOn prepareKotlinForForgeModDiscovery
    }
}

loom {
    mods {
        dlc_manager {
            sourceSet sourceSets.main
        }
        if (kotlinEnabled) {
            kotlinforforge {
                getModFiles().from(files(kotlinForForgeDiscoveryJar).builtBy(prepareKotlinForForgeModDiscovery))
            }
        }
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    modImplementation "dev.architectury:architectury-forge:${rootProject.architectury_api_version}"
    if ((rootProject.findProperty('enable_kotlin') ?: 'false').toString().toBoolean()) {
        modImplementation "thedarkcolour:kotlinforforge:${rootProject.kotlin_for_forge_version}"
        kotlinForForgeModDiscovery("thedarkcolour:kotlinforforge:${rootProject.kotlin_for_forge_version}:all") {
            transitive = false
        }
    }
    modImplementation "curse.maven:mafglib-910766:${rootProject.mafglib_curse_file}"
    include(implementation("com.cozooo.dlc_manager:dlc-fileops-helper:${file_ops_helper_version}"))
    include(implementation("org.commonmark:commonmark:0.21.0"))
    include(implementation("org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0"))
    forgeRuntimeLibrary "com.cozooo.dlc_manager:dlc-fileops-helper:${file_ops_helper_version}"
    forgeRuntimeLibrary "org.commonmark:commonmark:0.21.0"
    forgeRuntimeLibrary "org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionForge')) { transitive = false }
}

processResources {
    def kotlinForForgeDependency = kotlinEnabled ? """
[[dependencies.${rootProject.mod_id}]]
modId="kotlinforforge"
mandatory=true
versionRange="${rootProject.kotlin_for_forge_version_range}"
ordering="NONE"
side="BOTH"
""" : ""
    inputs.properties([
        mod_id: rootProject.mod_id,
        mod_name: rootProject.mod_name,
        mod_version: rootProject.mod_version,
        mod_author: rootProject.mod_author,
        mc_version: rootProject.minecraft_version,
        forge_loader_version_range: '[47,)',
        forge_minecraft_version_range: '[1.20.1,1.20.2)',
        kotlin_for_forge_dependency: kotlinForForgeDependency,
        mafglib_version_range: '[0.1.14,)',
        pack_format: rootProject.pack_format
    ])

    doLast { task ->
        rootProject.expandProcessedResource(task, 'META-INF/mods.toml', [
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_version: rootProject.mod_version,
            mod_author: rootProject.mod_author,
            mc_version: rootProject.minecraft_version,
            forge_loader_version_range: '[47,)',
            forge_minecraft_version_range: '[1.20.1,1.20.2)',
            kotlin_for_forge_dependency: kotlinForForgeDependency,
            mafglib_version_range: '[0.1.14,)'
        ])
        rootProject.expandProcessedResource(task, 'pack.mcmeta', [pack_format: rootProject.pack_format])
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile = shadowJar.archiveFile
    dependsOn shadowJar
    archiveFileName.set("DLC-Manager-forge-${rootProject.minecraft_version}-${rootProject.mod_version}.jar")
    destinationDirectory.set(rootProject.layout.projectDirectory.dir("../../output/${rootProject.findProperty('mod_version') ?: '0.0.0'}"))
}

jar {
    archiveClassifier = 'dev'
}

tasks.register('exportObfClasspath', Sync) {
    dependsOn(':common:jar')
    from({
        def jars = [] as LinkedHashSet<File>
        [configurations.compileClasspath, configurations.runtimeClasspath].each { cfg ->
            jars.addAll(cfg.resolve().findAll { it.name.endsWith('.jar') })
        }
        jars
    })
    into rootProject.layout.projectDirectory.dir("../../obf-lib/forge-${rootProject.minecraft_version}")
}
