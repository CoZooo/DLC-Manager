buildscript {
    def kotlinEnabledValue = gradle.startParameter.projectProperties['enable_kotlin']
    if (kotlinEnabledValue == null) {
        def rootPropsFile = file('../../gradle.properties')
        if (rootPropsFile.exists()) {
            def rootProps = new Properties()
            rootPropsFile.withInputStream { rootProps.load(it) }
            kotlinEnabledValue = rootProps.getProperty('enable_kotlin')
        }
    }
    if ((kotlinEnabledValue ?: 'false').toString().toBoolean()) {
        repositories {
            gradlePluginPortal()
            mavenCentral()
            maven { url = 'https://maven.cozozjw.cn/repository/maven-public/' }
        }
        dependencies {
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlin_version}"
        }
    }
}

plugins {
    id 'architectury-plugin' version "${architectury_plugin_version}"
    id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
    id 'com.gradleup.shadow' version "${shadow_version}" apply false
}

architectury {
    minecraft = minecraft_version
}

apply from: file('../architectury-common.gradle')
configureArchitecturyShared(17)

tasks.register('exportObfClasspathAll') {
    dependsOn ':fabric:exportObfClasspath', ':forge:exportObfClasspath'
}
