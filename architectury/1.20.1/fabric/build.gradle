plugins {
    id 'architectury-plugin'
    id 'dev.architectury.loom'
    id 'com.gradleup.shadow'
}

def kotlinEnabled = rootProject.architecturyBooleanProperty(project, 'enable_kotlin', false)
def kotlinExcludeJavaCompile = kotlinEnabled && rootProject.architecturyBooleanProperty(project, 'kotlin_exclude_java_compile', false)
def kotlinMainDirs = [
    '../../../fabric/src/main/kotlin',
    '../../../fabric/1.20.1/src/main/kotlin'
]
def javaMainDirs = [
    '../../../fabric/src/main/java',
    '../../../fabric/1.20.1/src/main/java'
]
def moduleProject = project

architectury {
    platformSetupLoomIde()
    fabric()
}

sourceSets {
    main {
        java.srcDirs = kotlinExcludeJavaCompile ? [] : javaMainDirs
        if (kotlinEnabled) {
            kotlin.srcDirs = kotlinMainDirs
            if (!kotlinExcludeJavaCompile) {
                java.exclude rootProject.javaSourcesReplacedByKotlin(project, kotlinMainDirs)
            }
        }
        resources.srcDir '../../../common/src/main/resources'
        resources.srcDir '../../../fabric/1.20.1/src/main/resources'
    }
}

if (kotlinEnabled) {
    tasks.named('compileKotlin').configure {
        if (!kotlinExcludeJavaCompile) {
            source(sourceSets.main.java)
        }
    }
    if (kotlinExcludeJavaCompile) {
        tasks.named('compileJava').configure {
            enabled = false
        }
        tasks.named('jar').configure {
            doFirst {
                rootProject.clearMainJavaClasses(moduleProject)
            }
        }
    } else {
        tasks.named('compileJava').configure {
            doFirst {
                rootProject.deleteJavaClassesReplacedByKotlin(moduleProject, kotlinMainDirs, destinationDirectory.get().asFile)
            }
        }
        tasks.named('jar').configure {
            doFirst {
                rootProject.deleteJavaClassesReplacedByKotlin(moduleProject, kotlinMainDirs, tasks.named('compileJava').get().destinationDirectory.get().asFile)
            }
        }
    }
} else {
    tasks.named('compileJava').configure {
        doFirst {
            rootProject.deleteKotlinClassesReplacedByJava(moduleProject, kotlinMainDirs, layout.buildDirectory.dir('classes/kotlin/main').get().asFile)
        }
    }
    tasks.named('jar').configure {
        doFirst {
            rootProject.deleteKotlinClassesReplacedByJava(moduleProject, kotlinMainDirs, layout.buildDirectory.dir('classes/kotlin/main').get().asFile)
        }
    }
}

rootProject.configureReplacementClassSync(moduleProject, kotlinEnabled, kotlinMainDirs, kotlinExcludeJavaCompile)
rootProject.configureLocalDevMods(moduleProject)
rootProject.configureServerRunClientOnlyModExcludes(moduleProject)

configurations {
    common
    shadowCommon
    obfLib
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    if ((rootProject.findProperty('enable_kotlin') ?: 'false').toString().toBoolean()) {
        modImplementation "net.fabricmc:fabric-language-kotlin:${rootProject.fabric_language_kotlin_version}"
    }
    obfLib "net.fabricmc:intermediary:${rootProject.minecraft_version}:v2"
    modImplementation "maven.modrinth:malilib:${rootProject.malilib_version}"
    if (rootProject.modmenu_version) {
        modCompileOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
    }
    include(implementation("com.cozooo.dlc_manager:dlc-fileops-helper:${file_ops_helper_version}"))
    include(implementation("org.commonmark:commonmark:0.21.0"))
    include(implementation("org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0"))

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}

processResources {
    def mcVersionRange = rootProject.findProperty('minecraft_version_range') ?: ">=${rootProject.minecraft_version} <1.20.2"
    inputs.properties([
        mod_id: rootProject.mod_id,
        mod_name: rootProject.mod_name,
        mod_version: rootProject.mod_version,
        mod_author: rootProject.mod_author,
        mc_version: rootProject.minecraft_version,
        mc_version_range: mcVersionRange,
        fabric_loader_version: rootProject.fabric_loader_version,
        fabric_api_version: rootProject.fabric_api_version,
        enable_kotlin: kotlinEnabled,
        fabric_language_kotlin_version: rootProject.fabric_language_kotlin_version,
        malilib_version: rootProject.malilib_version,
        pack_format: rootProject.pack_format
    ])

    doLast { task ->
        rootProject.expandProcessedFabricModJson(task, [
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_version: rootProject.mod_version,
            mod_author: rootProject.mod_author,
            mc_version: rootProject.minecraft_version,
            mc_version_range: mcVersionRange,
            fabric_loader_version: rootProject.fabric_loader_version,
            fabric_api_version: rootProject.fabric_api_version,
            malilib_version: rootProject.malilib_version,
            pack_format: rootProject.pack_format
        ], kotlinEnabled, rootProject.fabric_language_kotlin_version)
        rootProject.expandProcessedResource(task, 'pack.mcmeta', [pack_format: rootProject.pack_format])
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile = shadowJar.archiveFile
    dependsOn shadowJar
    archiveFileName.set("DLC-Manager-fabric-${rootProject.minecraft_version}-${rootProject.mod_version}.jar")
    destinationDirectory.set(rootProject.layout.projectDirectory.dir("../../output/${rootProject.findProperty('mod_version') ?: '0.0.0'}"))
}

jar {
    archiveClassifier = 'dev'
}

tasks.register('exportObfClasspath', Sync) {
    dependsOn(':common:jar')
    from({
        def jars = [] as LinkedHashSet<File>
        [configurations.compileClasspath, configurations.runtimeClasspath].each { cfg ->
            jars.addAll(cfg.resolve().findAll { it.name.endsWith('.jar') })
        }
        jars.addAll(configurations.obfLib.resolve().findAll { it.name.endsWith('.jar') })
        jars
    })
    into rootProject.layout.projectDirectory.dir("../../obf-lib/fabric-${rootProject.minecraft_version}")
}
