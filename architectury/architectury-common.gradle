ext.configureArchitecturyShared = { int defaultJavaVersion ->
    allprojects {
        group = mod_group
        version = mod_version

        repositories {
            maven {
                name = 'Minecraft Libraries'
                url = 'https://libraries.minecraft.net'
                content {
                    includeGroup 'org.lwjgl'
                }
            }
            maven {
                url = uri('https://maven.cozozjw.cn/repository/maven-public/')
            }
            maven {
                name = 'Aliyun Maven Public'
                url = 'https://maven.aliyun.com/repository/public'
            }
            maven {
                name = 'ParchmentMC'
                url = 'https://maven.parchmentmc.org'
            }
            maven { url = 'https://maven.architectury.dev/' }
            maven { url = 'https://maven.fabricmc.net/' }
            maven { url = 'https://maven.minecraftforge.net/' }
            maven { url = 'https://maven.neoforged.net/releases/' }
            if ((findProperty('enable_kotlin') ?: 'false').toString().toBoolean()) {
                maven {
                    name = 'Kotlin for Forge'
                    url = 'https://thedarkcolour.github.io/KotlinForForge/'
                }
            }
            maven { url = 'https://api.modrinth.com/maven' }
            maven { url = 'https://maven.terraformersmc.com' }
            maven { url = 'https://cursemaven.com' }
            mavenCentral()
        }
    }

    subprojects {
        apply plugin: 'dev.architectury.loom'
        apply plugin: 'maven-publish'

        def javaVersion = (project.findProperty('java_version') ?: String.valueOf(defaultJavaVersion)) as int
        def kotlinEnabled = (project.findProperty('enable_kotlin') ?: 'false').toString().toBoolean()
        def useParchment = (project.findProperty('use_parchment') ?: 'false').toString().toBoolean()
        def parchmentVersion = (project.findProperty('parchment_mappings_version') ?: '').toString().trim()

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(javaVersion)
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.release = javaVersion
        }

        if (kotlinEnabled) {
            apply plugin: 'org.jetbrains.kotlin.jvm'

            kotlin {
                jvmToolchain(javaVersion)
            }

            tasks.named('compileKotlin').configure {
                compilerOptions {
                    jvmTarget = "JVM_${javaVersion}"
                }
            }
        }

        loom {
            silentMojangMappingsLicense()
        }

        dependencies {
            minecraft "com.mojang:minecraft:${minecraft_version}"
            if (useParchment && !parchmentVersion.isEmpty()) {
                mappings loom.layered {
                    officialMojangMappings()
                    parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchmentVersion}@zip")
                }
            } else {
                mappings loom.officialMojangMappings()
            }
            testImplementation "org.junit.jupiter:junit-jupiter:${junit_jupiter_version}"
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    def javaComponent = components.findByName('java')
                    if (javaComponent != null) {
                        from javaComponent
                    }

                    groupId = rootProject.mod_group
                    artifactId = "${project.name}-${rootProject.minecraft_version}"
                    version = rootProject.mod_version
                }
            }

            repositories {
                def mavenUsername = findProperty('mavenUsername') ?: System.getenv('MAVEN_USERNAME')
                def mavenPassword = findProperty('mavenPassword') ?: System.getenv('MAVEN_PASSWORD')
                if (mavenUsername && mavenPassword) {
                    maven {
                        name = 'CozoooNexus'
                        url = uri('https://maven.cozozjw.cn/repository/maven-releases/')
                        credentials {
                            username = mavenUsername
                            password = mavenPassword
                        }
                    }
                }
                def ghRepo = System.getenv('GITHUB_REPOSITORY')
                def ghUser = System.getenv('USERNAME')
                def ghToken = System.getenv('TOKEN')
                if (ghRepo && ghUser && ghToken) {
                    maven {
                        name = 'GitHubPackages'
                        url = uri("https://maven.pkg.github.com/${ghRepo}")
                        credentials {
                            username = ghUser
                            password = ghToken
                        }
                    }
                }
            }
        }
    }
}

ext.javaSourcesReplacedByKotlin = { Project targetProject, List<String> kotlinSourceDirs ->
    def excludes = []
    kotlinSourceDirs.each { String sourceDir ->
        def root = targetProject.file(sourceDir)
        if (!root.exists()) {
            return
        }
        targetProject.fileTree(root) {
            include '**/*.kt'
        }.each { File kotlinFile ->
            def relative = root.toPath().relativize(kotlinFile.toPath()).toString().replace(File.separatorChar, '/' as char)
            excludes.add(relative.replaceFirst(/\.kt$/, '.java'))
        }
    }
    return excludes
}

ext.deleteJavaClassesReplacedByKotlin = { Project targetProject, List<String> kotlinSourceDirs, File javaClassesDir ->
    if (!javaClassesDir.exists()) {
        return
    }
    rootProject.javaSourcesReplacedByKotlin(targetProject, kotlinSourceDirs).each { String javaPath ->
        def classPath = javaPath.replaceFirst(/\.java$/, '')
        def slash = classPath.lastIndexOf('/')
        def classDir = slash >= 0 ? new File(javaClassesDir, classPath.substring(0, slash)) : javaClassesDir
        def className = slash >= 0 ? classPath.substring(slash + 1) : classPath
        if (!classDir.exists()) {
            return
        }
        targetProject.delete(targetProject.fileTree(classDir) {
            include "${className}.class"
            include "${className}\$*.class"
        })
    }
}

ext.deleteKotlinClassesReplacedByJava = { Project targetProject, List<String> kotlinSourceDirs, File kotlinClassesDir ->
    if (!kotlinClassesDir.exists()) {
        return
    }
    rootProject.javaSourcesReplacedByKotlin(targetProject, kotlinSourceDirs).each { String javaPath ->
        def classPath = javaPath.replaceFirst(/\.java$/, '')
        def slash = classPath.lastIndexOf('/')
        def classDir = slash >= 0 ? new File(kotlinClassesDir, classPath.substring(0, slash)) : kotlinClassesDir
        def className = slash >= 0 ? classPath.substring(slash + 1) : classPath
        if (!classDir.exists()) {
            return
        }
        targetProject.delete(targetProject.fileTree(classDir) {
            include "${className}.class"
            include "${className}\$*.class"
        })
    }
}
