ext.architecturyBooleanProperty = { Project targetProject, String propertyName, boolean fallback ->
    def value = targetProject.extensions.extraProperties.has(propertyName)
        ? targetProject.extensions.extraProperties.get(propertyName)
        : null
    if (value == null) {
        value = rootProject.findProperty(propertyName)
    }
    return value == null ? fallback : value.toString().toBoolean()
}

ext.expandProcessedResource = { Task task, String relativePath, Map values ->
    def outputFile = new File(task.destinationDir, relativePath)
    if (!outputFile.exists()) {
        throw new GradleException("Processed resource not found: ${outputFile}")
    }
    def text = outputFile.getText('UTF-8')
    values.each { key, value ->
        text = text.replace('${' + key + '}', value == null ? '' : value.toString())
    }
    outputFile.setText(text, 'UTF-8')
}

ext.expandProcessedFabricModJson = { Task task, Map values, boolean includeKotlinDependency, Object fabricLanguageKotlinVersion ->
    rootProject.expandProcessedResource(task, 'fabric.mod.json', values)
    if (!includeKotlinDependency) {
        return
    }

    def outputFile = new File(task.destinationDir, 'fabric.mod.json')
    def json = new groovy.json.JsonSlurper().parse(outputFile)
    json.depends['fabric-language-kotlin'] = ">=${fabricLanguageKotlinVersion}".toString()
    outputFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)) + '\n', 'UTF-8')
}

ext.configureArchitecturyShared = { int defaultJavaVersion ->
    allprojects {
        group = rootProject.mod_group
        version = rootProject.mod_version

        repositories {
            maven {
                name = 'Minecraft Libraries'
                url = 'https://libraries.minecraft.net'
                content {
                    includeGroup 'org.lwjgl'
                }
            }
            maven {
                url = uri('https://maven.cozozjw.cn/repository/maven-public/')
            }
            maven {
                name = 'ParchmentMC'
                url = 'https://maven.parchmentmc.org'
            }
            maven { url = 'https://maven.architectury.dev/' }
            maven { url = 'https://maven.fabricmc.net/' }
            maven { url = 'https://maven.minecraftforge.net/' }
            maven { url = 'https://maven.neoforged.net/releases/' }
            if (rootProject.architecturyBooleanProperty(project, 'enable_kotlin', false)) {
                maven {
                    name = 'Kotlin for Forge'
                    url = 'https://thedarkcolour.github.io/KotlinForForge/'
                }
            }
            maven { url = 'https://api.modrinth.com/maven' }
            maven { url = 'https://maven.terraformersmc.com' }
            maven { url = 'https://cursemaven.com' }
            mavenCentral()
        }
    }

    subprojects {
        apply plugin: 'dev.architectury.loom'
        apply plugin: 'maven-publish'

        def javaVersion = (project.findProperty('java_version') ?: String.valueOf(defaultJavaVersion)) as int
        def kotlinEnabled = rootProject.architecturyBooleanProperty(project, 'enable_kotlin', false)
        def useParchment = (project.findProperty('use_parchment') ?: 'false').toString().toBoolean()
        def parchmentVersion = (project.findProperty('parchment_mappings_version') ?: '').toString().trim()

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(javaVersion)
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.release = javaVersion
        }

        tasks.withType(Jar).configureEach {
            exclude('rebel.xml')
        }

        if (kotlinEnabled) {
            apply plugin: 'org.jetbrains.kotlin.jvm'

            kotlin {
                jvmToolchain(javaVersion)
            }
        }

        loom {
            silentMojangMappingsLicense()
            runs {
                client {
                    runDir('run/client')
                }
                server {
                    runDir('run/server')
                }
            }
        }

        dependencies {
            minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
            if (useParchment && !parchmentVersion.isEmpty()) {
                mappings loom.layered {
                    officialMojangMappings()
                    parchment("org.parchmentmc.data:parchment-${rootProject.minecraft_version}:${parchmentVersion}@zip")
                }
            } else {
                mappings loom.officialMojangMappings()
            }
            testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.junit_jupiter_version}"
            testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${rootProject.junit_jupiter_version}"
            testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    def javaComponent = components.findByName('java')
                    if (javaComponent != null) {
                        from javaComponent
                    }

                    groupId = rootProject.mod_group
                    artifactId = "${project.name}-${rootProject.minecraft_version}"
                    version = rootProject.mod_version
                }
            }

            repositories {
                def mavenUsername = findProperty('mavenUsername') ?: System.getenv('MAVEN_USERNAME')
                def mavenPassword = findProperty('mavenPassword') ?: System.getenv('MAVEN_PASSWORD')
                if (mavenUsername && mavenPassword) {
                    maven {
                        name = 'CozoooNexus'
                        url = uri('https://maven.cozozjw.cn/repository/maven-releases/')
                        credentials {
                            username = mavenUsername
                            password = mavenPassword
                        }
                    }
                }
                def ghRepo = System.getenv('GITHUB_REPOSITORY')
                def ghUser = System.getenv('USERNAME')
                def ghToken = System.getenv('TOKEN')
                if (ghRepo && ghUser && ghToken) {
                    maven {
                        name = 'GitHubPackages'
                        url = uri("https://maven.pkg.github.com/${ghRepo}")
                        credentials {
                            username = ghUser
                            password = ghToken
                        }
                    }
                }
            }
        }
    }
}

ext.javaSourcesReplacedByKotlin = { Project targetProject, List<String> kotlinSourceDirs ->
    def excludes = []
    kotlinSourceDirs.each { String sourceDir ->
        def root = targetProject.file(sourceDir)
        if (!root.exists()) {
            return
        }
        targetProject.fileTree(root) {
            include '**/*.kt'
        }.each { File kotlinFile ->
            def relative = root.toPath().relativize(kotlinFile.toPath()).toString().replace(File.separatorChar, '/' as char)
            excludes.add(relative.replaceFirst(/\.kt$/, '.java'))
        }
    }
    return excludes
}

ext.deleteJavaClassesReplacedByKotlin = { Project targetProject, List<String> kotlinSourceDirs, File javaClassesDir ->
    if (!javaClassesDir.exists()) {
        return
    }
    rootProject.javaSourcesReplacedByKotlin(targetProject, kotlinSourceDirs).each { String javaPath ->
        def classPath = javaPath.replaceFirst(/\.java$/, '')
        def slash = classPath.lastIndexOf('/')
        def classDir = slash >= 0 ? new File(javaClassesDir, classPath.substring(0, slash)) : javaClassesDir
        def className = slash >= 0 ? classPath.substring(slash + 1) : classPath
        if (!classDir.exists()) {
            return
        }
        targetProject.delete(targetProject.fileTree(classDir) {
            include "${className}.class"
            include "${className}\$*.class"
        })
    }
}

ext.deleteKotlinClassesReplacedByJava = { Project targetProject, List<String> kotlinSourceDirs, File kotlinClassesDir ->
    if (!kotlinClassesDir.exists()) {
        return
    }
    rootProject.javaSourcesReplacedByKotlin(targetProject, kotlinSourceDirs).each { String javaPath ->
        def classPath = javaPath.replaceFirst(/\.java$/, '')
        def slash = classPath.lastIndexOf('/')
        def classDir = slash >= 0 ? new File(kotlinClassesDir, classPath.substring(0, slash)) : kotlinClassesDir
        def className = slash >= 0 ? classPath.substring(slash + 1) : classPath
        if (!classDir.exists()) {
            return
        }
        targetProject.delete(targetProject.fileTree(classDir) {
            include "${className}.class"
            include "${className}\$*.class"
        })
    }
}

ext.clearMainJavaClasses = { Project targetProject ->
    def compileJavaTask = targetProject.tasks.findByName('compileJava')
    if (compileJavaTask == null || !compileJavaTask.hasProperty('destinationDirectory')) {
        return
    }
    targetProject.delete(compileJavaTask.destinationDirectory.get().asFile)
}

ext.configureReplacementClassSync = { Project targetProject, boolean kotlinEnabled, List<String> kotlinSourceDirs, boolean excludeJavaCompile = false ->
    def syncTask = targetProject.tasks.register('syncReplacementClasses') {
        if (kotlinEnabled && targetProject.tasks.findByName('compileKotlin') != null) {
            dependsOn targetProject.tasks.named('compileKotlin')
        } else {
            dependsOn targetProject.tasks.named('compileJava')
        }

        doLast {
            if (kotlinEnabled) {
                if (excludeJavaCompile) {
                    rootProject.clearMainJavaClasses(targetProject)
                } else {
                    rootProject.deleteJavaClassesReplacedByKotlin(
                        targetProject,
                        kotlinSourceDirs,
                        targetProject.tasks.named('compileJava').get().destinationDirectory.get().asFile
                    )
                }
            } else {
                rootProject.deleteKotlinClassesReplacedByJava(
                    targetProject,
                    kotlinSourceDirs,
                    targetProject.layout.buildDirectory.dir('classes/kotlin/main').get().asFile
                )
            }
        }
    }

    targetProject.tasks.matching { it.name == 'classes' || it.name == 'runClient' || it.name == 'runServer' }.configureEach {
        dependsOn syncTask
    }
}

ext.configureLocalDevMods = { Project targetProject ->
    def sharedDevModJars = targetProject.fileTree(targetProject.file('run/devmods')) {
        include '**/*.jar'
    }
    def clientDevModJars = targetProject.fileTree(targetProject.file('run/client/devmods')) {
        include '**/*.jar'
    }
    def serverDevModJars = targetProject.fileTree(targetProject.file('run/server/devmods')) {
        include '**/*.jar'
    }
    def devModJars = targetProject.files(sharedDevModJars, clientDevModJars, serverDevModJars)
    def isDevModArtifact = { File file, devModFiles ->
        devModFiles.files.any { devModFile ->
            def fileName = devModFile.name
            def baseName = fileName.endsWith('.jar') ? fileName.substring(0, fileName.length() - 4) : fileName
            file.absolutePath == devModFile.absolutePath || file.name == fileName || file.name.contains(baseName)
        }
    }
    def excludeDevModsFromTask = { task, devModFiles ->
        task.classpath = task.classpath.filter { File file ->
            !isDevModArtifact(file, devModFiles)
        }
        if (task.hasProperty('internalClasspath')) {
            task.internalClasspath.setFrom(task.internalClasspath.filter { File file ->
                !isDevModArtifact(file, devModFiles)
            })
        }
    }

    def localRuntimeConfig = targetProject.configurations.findByName('modLocalRuntime')
    if (localRuntimeConfig != null) {
        targetProject.dependencies.add(localRuntimeConfig.name, devModJars)
    } else {
        def runtimeConfig = targetProject.configurations.findByName('modRuntimeOnly')
        if (runtimeConfig != null) {
            targetProject.dependencies.add(runtimeConfig.name, devModJars)
        }
    }

    targetProject.tasks.matching { it.name == 'runClient' }.configureEach { task ->
        excludeDevModsFromTask(task, serverDevModJars)
    }
    targetProject.tasks.matching { it.name == 'runServer' }.configureEach { task ->
        excludeDevModsFromTask(task, clientDevModJars)
    }
}

ext.configureServerRunClientOnlyModExcludes = { Project targetProject ->
    def serverRunCommonJar = targetProject.tasks.register('prepareServerRunCommonJar', Jar) {
        dependsOn(targetProject.project(':common').tasks.named('jar'))
        archiveBaseName.set('common')
        archiveClassifier.set('server-run')
        destinationDirectory.set(targetProject.layout.buildDirectory.dir('serverRun'))
        from({
            targetProject.zipTree(targetProject.project(':common').tasks.named('jar').get().archiveFile.get().asFile)
        }) {
            exclude 'com/cozooo/dlc_manager/client/screen/**'
        }
    }

    targetProject.tasks.matching { it.name == 'runServer' }.configureEach { task ->
        dependsOn(serverRunCommonJar)
        def serverOnlyCommonFiles = targetProject.files(serverRunCommonJar.flatMap { it.archiveFile })
        task.classpath = task.classpath.filter { File file ->
            def name = file.name.toLowerCase(Locale.ROOT)
            !name.contains('mafglib')
                && !name.contains('malilib')
                && !(name.startsWith('common-') && name.endsWith('-dev.jar') && file.parentFile?.name == 'devlibs')
        } + serverOnlyCommonFiles
    }
}
