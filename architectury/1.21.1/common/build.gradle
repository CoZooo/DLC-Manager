plugins {
    id 'architectury-plugin'
    id 'dev.architectury.loom'
}

architectury {
    common(rootProject.enabled_platforms.split(','))
}

def kotlinEnabled = rootProject.architecturyBooleanProperty(project, 'enable_kotlin', false)
def kotlinSourcesEnabled = kotlinEnabled && plugins.hasPlugin('org.jetbrains.kotlin.jvm')
def kotlinExcludeJavaCompile = kotlinSourcesEnabled && rootProject.architecturyBooleanProperty(project, 'kotlin_exclude_java_compile', false)
def kotlinMainDirs = [
    '../../../common/src/main/kotlin',
    '../../../common/1.21.1/src/main/kotlin'
]
def javaMainDirs = [
    '../../../common/src/main/java',
    '../../../common/1.21.1/src/main/java'
]
def moduleProject = project

sourceSets {
    main {
        java.srcDirs = kotlinExcludeJavaCompile ? [] : javaMainDirs
        if (kotlinSourcesEnabled) {
            kotlin.srcDirs = kotlinMainDirs
            if (!kotlinExcludeJavaCompile) {
                java.exclude rootProject.javaSourcesReplacedByKotlin(project, kotlinMainDirs)
            }
        }
        resources.srcDirs = [
            '../../../common/src/main/resources',
            '../../../common/1.21.1/src/main/resources'
        ]
    }
    test {
        java.srcDirs = [
            '../../../common/src/test/java',
            '../../../common/1.21.1/src/test/java'
        ]
        resources.srcDirs = [
            '../../../common/src/test/resources',
            '../../../common/1.21.1/src/test/resources'
        ]
    }
}

if (kotlinSourcesEnabled) {
    tasks.named('compileKotlin').configure {
        if (!kotlinExcludeJavaCompile) {
            source(sourceSets.main.java)
        }
    }
    if (kotlinExcludeJavaCompile) {
        tasks.named('compileJava').configure {
            enabled = false
        }
        tasks.named('jar').configure {
            doFirst {
                rootProject.clearMainJavaClasses(moduleProject)
            }
        }
    } else {
        tasks.named('compileJava').configure {
            doFirst {
                rootProject.deleteJavaClassesReplacedByKotlin(moduleProject, kotlinMainDirs, destinationDirectory.get().asFile)
            }
        }
        tasks.named('jar').configure {
            doFirst {
                rootProject.deleteJavaClassesReplacedByKotlin(moduleProject, kotlinMainDirs, tasks.named('compileJava').get().destinationDirectory.get().asFile)
            }
        }
    }
} else {
    tasks.named('compileJava').configure {
        doFirst {
            rootProject.deleteKotlinClassesReplacedByJava(moduleProject, kotlinMainDirs, layout.buildDirectory.dir('classes/kotlin/main').get().asFile)
        }
    }
    tasks.named('jar').configure {
        doFirst {
            rootProject.deleteKotlinClassesReplacedByJava(moduleProject, kotlinMainDirs, layout.buildDirectory.dir('classes/kotlin/main').get().asFile)
        }
    }
}

rootProject.configureReplacementClassSync(moduleProject, kotlinSourcesEnabled, kotlinMainDirs, kotlinExcludeJavaCompile)

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "dev.architectury:architectury:${rootProject.architectury_api_version}"
    modImplementation "maven.modrinth:malilib:${rootProject.malilib_version}"

    implementation "com.google.code.gson:gson:2.10.1"
    implementation "org.commonmark:commonmark:0.21.0"
    implementation "org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0"
    implementation "com.cozooo.dlc_manager:dlc-fileops-helper:${file_ops_helper_version}"
}
