pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.cozozjw.cn/repository/maven-public/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        mavenCentral()
    }
}

def sharedPropsFile = file('../../gradle.properties')
def sharedProps = new Properties()
if (sharedPropsFile.exists()) {
    sharedPropsFile.withInputStream { sharedProps.load(it) }
}
def sharedProjectProps = [:]
sharedProps.each { key, value ->
    def propKey = key.toString()
    if (propKey.startsWith('org.gradle.') || propKey.startsWith('systemProp.')) {
        return
    }
    sharedProjectProps[propKey] = value
}
startParameter.projectProperties.each { key, value ->
    def propKey = key.toString()
    if (propKey.startsWith('org.gradle.') || propKey.startsWith('systemProp.')) {
        return
    }
    sharedProjectProps[propKey] = value
}

gradle.beforeProject { project ->
    sharedProjectProps.each { key, value ->
        project.ext.set(key, value)
    }
}

rootProject.name = 'DLC-Manager-Architectury-1.21.1'

def commonOnly = (startParameter.projectProperties['common_only'] ?: 'false').toString().toBoolean()
include ':common'
if (!commonOnly) {
    include ':fabric', ':neoforge'
}
