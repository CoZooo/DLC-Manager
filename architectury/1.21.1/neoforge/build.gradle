plugins {
    id 'architectury-plugin'
    id 'dev.architectury.loom'
    id 'com.github.johnrengelman.shadow'
}

def kotlinEnabled = (rootProject.findProperty('enable_kotlin') ?: 'false').toString().toBoolean()
def kotlinMainDirs = [
    '../../../neoforge/src/main/kotlin',
    '../../../neoforge/1.21.1/src/main/kotlin'
]
def moduleProject = project
def kotlinForForgeVersion = rootProject.kotlin_for_forge_version

architectury {
    platformSetupLoomIde()
    neoForge()
}

sourceSets {
    main {
        java.srcDirs = [
            '../../../neoforge/src/main/java',
            '../../../neoforge/1.21.1/src/main/java'
        ]
        if (kotlinEnabled) {
            kotlin.srcDirs = kotlinMainDirs
            java.exclude rootProject.javaSourcesReplacedByKotlin(project, kotlinMainDirs)
        }
        resources.srcDir '../../../neoforge/1.21.1/src/main/resources'
    }
}

if (kotlinEnabled) {
    tasks.named('compileKotlin').configure {
        source(sourceSets.main.java)
    }
    tasks.named('compileJava').configure {
        doFirst {
            rootProject.deleteJavaClassesReplacedByKotlin(moduleProject, kotlinMainDirs, destinationDirectory.get().asFile)
        }
    }
    tasks.named('jar').configure {
        doFirst {
            rootProject.deleteJavaClassesReplacedByKotlin(moduleProject, kotlinMainDirs, tasks.named('compileJava').get().destinationDirectory.get().asFile)
        }
    }
} else {
    tasks.named('compileJava').configure {
        doFirst {
            rootProject.deleteKotlinClassesReplacedByJava(moduleProject, kotlinMainDirs, layout.buildDirectory.dir('classes/kotlin/main').get().asFile)
        }
    }
    tasks.named('jar').configure {
        doFirst {
            rootProject.deleteKotlinClassesReplacedByJava(moduleProject, kotlinMainDirs, layout.buildDirectory.dir('classes/kotlin/main').get().asFile)
        }
    }
}

rootProject.configureReplacementClassSync(moduleProject, kotlinEnabled, kotlinMainDirs)
rootProject.configureLocalDevMods(moduleProject)

configurations {
    common
    shadowCommon
    kotlinForForgeModDiscovery
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

if (kotlinEnabled) {
    configurations.runtimeClasspath {
        exclude group: 'org.jetbrains.kotlin'
    }
}

def kotlinForForgeDiscoveryJar = layout.buildDirectory.file("kotlinForForgeModDiscovery/kotlinforforge-neoforge.jar")
def prepareKotlinForForgeModDiscovery = tasks.register('prepareKotlinForForgeModDiscovery', Copy) {
    from(configurations.kotlinForForgeModDiscovery)
    into(kotlinForForgeDiscoveryJar.map { it.asFile.parentFile })
    rename { 'kotlinforforge-neoforge.jar' }
}

if (kotlinEnabled) {
    tasks.matching {
        it.name == 'generateDLIConfig' || it.name == 'runClient' || it.name == 'runServer'
    }.configureEach {
        dependsOn prepareKotlinForForgeModDiscovery
    }
}

loom {
    mods {
        dlc_manager {
            sourceSet sourceSets.main
        }
        if (kotlinEnabled) {
            kotlinforforge {
                getModFiles().from(files(kotlinForForgeDiscoveryJar).builtBy(prepareKotlinForForgeModDiscovery))
            }
        }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
    if ((rootProject.findProperty('enable_kotlin') ?: 'false').toString().toBoolean()) {
        kotlinForForgeModDiscovery("thedarkcolour:kotlinforforge-neoforge:${kotlinForForgeVersion}") {
            transitive = false
        }
        modImplementation("thedarkcolour:kfflang-neoforge:${kotlinForForgeVersion}") {
            transitive = false
        }
        modImplementation("thedarkcolour:kffmod-neoforge:${kotlinForForgeVersion}") {
            transitive = false
        }
    }
    modImplementation "curse.maven:mafglib-910766:${rootProject.mafglib_curse_file}"
    include(implementation("com.cozooo.dlc_manager:dlc-fileops-helper:${file_ops_helper_version}"))
    include(implementation("org.commonmark:commonmark:0.21.0"))
    include(implementation("org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0"))

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}

processResources {
    def neoMcVersionRange = rootProject.findProperty('neoforge_minecraft_version_range') ?: "[${rootProject.minecraft_version},${rootProject.minecraft_version}]"
    def kotlinForForgeDependency = kotlinEnabled ? """
[[dependencies.${rootProject.mod_id}]]
modId="kotlinforforge"
mandatory=true
versionRange="${rootProject.kotlin_for_forge_version_range}"
ordering="NONE"
side="BOTH"
""" : ""
    inputs.properties([
        mod_id: rootProject.mod_id,
        mod_name: rootProject.mod_name,
        mod_version: rootProject.mod_version,
        mod_author: rootProject.mod_author,
        mc_version: rootProject.minecraft_version,
        neoforge_loader_version_range: '[1,)',
        neoforge_version_range: '[21.1,21.2)',
        neoforge_minecraft_version_range: neoMcVersionRange,
        kotlin_for_forge_dependency: kotlinForForgeDependency,
        mafglib_version_range: '[0.4.2,)',
        pack_format: rootProject.pack_format
    ])

    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_version: rootProject.mod_version,
            mod_author: rootProject.mod_author,
            mc_version: rootProject.minecraft_version,
            neoforge_loader_version_range: '[1,)',
            neoforge_version_range: '[21.1,21.2)',
            neoforge_minecraft_version_range: neoMcVersionRange,
            kotlin_for_forge_dependency: kotlinForForgeDependency,
            mafglib_version_range: '[0.4.2,)'
        ])
    }

    filesMatching('pack.mcmeta') {
        expand([pack_format: rootProject.pack_format])
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile = shadowJar.archiveFile
    dependsOn shadowJar
    archiveFileName.set("DLC-Manager-neoforge-${rootProject.minecraft_version}-${rootProject.mod_version}.jar")
    destinationDirectory.set(rootProject.layout.projectDirectory.dir("../../output/${rootProject.findProperty('mod_version') ?: '0.0.0'}"))
}

jar {
    archiveClassifier = 'dev'
}

tasks.register('exportObfClasspath', Sync) {
    dependsOn(':common:jar')
    from({
        def jars = [] as LinkedHashSet<File>
        [configurations.compileClasspath, configurations.runtimeClasspath].each { cfg ->
            jars.addAll(cfg.resolve().findAll { it.name.endsWith('.jar') })
        }
        jars
    })
    into rootProject.layout.projectDirectory.dir("../../obf-lib/neoforge-${rootProject.minecraft_version}")
}
