tasks.register('obfuscateForge1201Yguard') {
    group = 'build'
    description = 'Obfuscate Forge 1.20.1 output jar with yGuard.'
    dependsOn(gradle.includedBuild('arch1201').task(':forge:exportObfClasspath'))
    dependsOn(tasks.named('archBuild'))
    doLast {
        runYGuardObfuscation(
            file("output/${currentModVersion}/DLC-Manager-forge-1.20.1-${currentModVersion}.jar"),
            file("output/${currentModVersion}/yGuard/DLC-Manager-forge-1.20.1-${currentModVersion}.jar"),
            file('obf-lib/forge-1.20.1')
        )
    }
}

