    - name: Upload output to Release
      if: ${{ github.event_name == 'release' }}
      run: |
        ls -la "output/${MOD_VERSION}" || true
        gh release upload "${{ github.event.release.tag_name }}" "output/${MOD_VERSION}"/* --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload output artifact (manual)
      if: ${{ github.event_name == 'workflow_dispatch' }}
      uses: actions/upload-artifact@v4
      with:
        name: output-${{ env.MOD_VERSION }}
        path: output/${{ env.MOD_VERSION }}

    - name: Publish to GitHub Packages
      run: ./gradlew publish
      env:
        USERNAME: ${{ github.actor }}
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
