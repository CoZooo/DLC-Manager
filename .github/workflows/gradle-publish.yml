name: Architectury Release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Resolve mod version
      run: echo "MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"

    - name: Run yGuard obfuscation
      run: ./gradlew obfuscateAllYguard

    - name: Run jar-obfuscator
      run: |
        set -euo pipefail

        if [ ! -f "jar-obfuscator.jar" ]; then
          echo "Missing jar-obfuscator.jar in repository root"
          exit 1
        fi
        if [ ! -f "config.yaml" ]; then
          echo "Missing config.yaml in repository root"
          exit 1
        fi

        mkdir -p jar-obf-lib

        run_one() {
          local loader="$1"
          local mcver="$2"
          local libdir="$3"
          local jar_path="output/${MOD_VERSION}/yGuard/DLC-Manager-${loader}-${mcver}-${MOD_VERSION}.jar"

          echo "==> Processing ${jar_path}"
          rm -rf jar-obf-lib/*
          cp -a "obf-lib/${libdir}/." jar-obf-lib/
          java -jar jar-obfuscator.jar --jar "${jar_path}" --config config.yaml
          rm -rf jar-obf-lib/*
        }

        run_one "forge" "1.20.1" "forge-1.20.1"
        run_one "fabric" "1.20.1" "fabric-1.20.1"
        run_one "fabric" "1.21.1" "fabric-1.21.1"
        run_one "neoforge" "1.21.1" "neoforge-1.21.1"

    - name: Prepare release jars
      run: |
        set -euo pipefail
        release_dir="output/${MOD_VERSION}/release"
        mkdir -p "${release_dir}"

        stage_one() {
          local loader="$1"
          local mcver="$2"
          local src="DLC-Manager-${loader}-${mcver}-${MOD_VERSION}_obf.jar"
          local dst="${release_dir}/DLC-Manager-${loader}-${mcver}-${MOD_VERSION}.jar"

          if [ ! -f "${src}" ]; then
            echo "Missing obfuscated jar: ${src}"
            exit 1
          fi

          cp -f "${src}" "${dst}"
        }

        stage_one "forge" "1.20.1"
        stage_one "fabric" "1.20.1"
        stage_one "fabric" "1.21.1"
        stage_one "neoforge" "1.21.1"

        ls -la "${release_dir}"

    - name: Upload output to Release
      if: ${{ github.event_name == 'release' }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" "output/${MOD_VERSION}/release/"*.jar --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload output artifact (manual)
      if: ${{ github.event_name == 'workflow_dispatch' }}
      uses: actions/upload-artifact@v4
      with:
        name: output-obf-renamed-${{ env.MOD_VERSION }}
        path: output/${{ env.MOD_VERSION }}/release

    - name: Publish to GitHub Packages
      run: ./gradlew publish
      env:
        USERNAME: ${{ github.actor }}
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
