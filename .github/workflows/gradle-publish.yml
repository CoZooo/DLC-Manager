name: Gradle Package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Resolve mod version
      run: echo "MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"

    - name: Build Forge + NeoForge
      run: ./gradlew build --parallel

    - name: Build Fabric
      run: |
        cd fabric-build
        ./gradlew build --parallel

    - name: Upload output to Release
      if: ${{ github.event_name == 'release' }}
      run: |
        ls -la "output/${MOD_VERSION}" || true
        gh release upload "${{ github.event.release.tag_name }}" "output/${MOD_VERSION}"/* --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload output artifact (manual)
      if: ${{ github.event_name == 'workflow_dispatch' }}
      uses: actions/upload-artifact@v4
      with:
        name: output-${{ env.MOD_VERSION }}
        path: output/${{ env.MOD_VERSION }}

    - name: Publish to GitHub Packages
      run: ./gradlew publish
      env:
        USERNAME: ${{ github.actor }}
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
