name: Build External Manager Installers

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  installers:
    name: Installer (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows
          - runner: ubuntu-24.04
            platform: linux
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-15-intel
            platform: mac-x64
          - runner: macos-15
            platform: mac-aarch64
    defaults:
      run:
        shell: bash
    env:
      TARGET_PLATFORM: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Set up Node for embedded DC Editor
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/dc-editor/package-lock.json

      - name: Install DC Editor dependencies
        working-directory: tools/dc-editor
        run: npm ci

      - name: Configure WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wixBin = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'
          if (!(Test-Path (Join-Path $wixBin 'candle.exe'))) {
            throw 'WiX 3.14 is missing from this runner.'
          }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Resolve application version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          properties = dict(line.split('=', 1) for line in Path('gradle.properties').read_text().splitlines() if '=' in line and not line.lstrip().startswith('#'))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('MOD_VERSION=' + properties['mod_version'].strip() + '\n')
              output.write('INSTALLER_OUTPUT_DIR=output/' + properties['mod_version'].strip() + ('/notarized' if os.environ['RUNNER_OS'] == 'macOS' else '') + '\n')
          PY

      - name: Configure macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          MAC_CERTIFICATES_P12_BASE64: ${{ secrets.MAC_CERTIFICATES_P12_BASE64 }}
          MAC_CERTIFICATES_PASSWORD: ${{ secrets.MAC_CERTIFICATES_PASSWORD }}
          MAC_NOTARY_KEY_BASE64: ${{ secrets.MAC_NOTARY_KEY_BASE64 }}
          MAC_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          MAC_NOTARY_ISSUER_ID: ${{ secrets.MAC_NOTARY_ISSUER_ID }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          run_private() {
            if ! "$@" > /dev/null 2>&1; then
              echo '::error::macOS credential setup failed; check the signing and notarization Secrets.'
              return 1
            fi
          }
          : "${MAC_SIGNING_IDENTITY:?Set the MAC_SIGNING_IDENTITY repository secret}"
          : "${MAC_CERTIFICATES_P12_BASE64:?Missing signing certificates}"
          : "${MAC_CERTIFICATES_PASSWORD:?Missing certificate password}"
          : "${MAC_NOTARY_KEY_BASE64:?Missing notarization API key}"
          : "${MAC_NOTARY_KEY_ID:?Missing notarization key ID}"
          : "${MAC_NOTARY_ISSUER_ID:?Missing notarization issuer ID}"
          signing_dir=$(mktemp -d "$RUNNER_TEMP/dlcm-signing.XXXXXX")
          keychain="$signing_dir/signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          {
            echo "MAC_SIGNING_DIR=$signing_dir"
            echo "MAC_SIGNING_KEYCHAIN=$keychain"
            echo "MAC_NOTARY_KEYCHAIN=$keychain"
            echo "MAC_NOTARY_PROFILE=dlcm-notary"
          } >> "$GITHUB_ENV"
          printf '%s' "$MAC_CERTIFICATES_P12_BASE64" | base64 --decode > "$signing_dir/certificates.p12" 2> /dev/null
          printf '%s' "$MAC_NOTARY_KEY_BASE64" | base64 --decode > "$signing_dir/AuthKey.p8" 2> /dev/null
          chmod 600 "$signing_dir/certificates.p12" "$signing_dir/AuthKey.p8"
          while IFS= read -r key_line || [[ -n "$key_line" ]]; do
            if [[ -n "$key_line" ]]; then
              echo "::add-mask::$key_line"
            fi
          done < "$signing_dir/AuthKey.p8"
          run_private security create-keychain -p "$keychain_password" "$keychain"
          run_private security set-keychain-settings -lut 21600 "$keychain"
          run_private security unlock-keychain -p "$keychain_password" "$keychain"
          run_private security import "$signing_dir/certificates.p12" -k "$keychain" -P "$MAC_CERTIFICATES_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          run_private security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" 2> /dev/null | grep -F "Developer ID Application: $MAC_SIGNING_IDENTITY" > /dev/null; then
            echo '::error::Developer ID Application identity is missing or invalid.'
            exit 1
          fi
          if ! security find-identity -v "$keychain" 2> /dev/null | grep -F "Developer ID Installer: $MAC_SIGNING_IDENTITY" > /dev/null; then
            echo '::error::Developer ID Installer identity is missing or invalid.'
            exit 1
          fi
          run_private xcrun notarytool store-credentials dlcm-notary --keychain "$keychain" --key "$signing_dir/AuthKey.p8" --key-id "$MAC_NOTARY_KEY_ID" --issuer "$MAC_NOTARY_ISSUER_ID"

      - name: Build installers
        if: runner.os != 'macOS'
        run: ./gradlew --project-dir tools/dlc-javafx-manager jpackageInstallers --console=plain

      - name: Build signed and notarized macOS installers
        if: runner.os == 'macOS'
        env:
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
        run: |
          set +x
          ./gradlew --project-dir tools/dlc-javafx-manager notarizeInstallers -PmacSign=true --no-configuration-cache --console=plain

      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        run: |
          dmg="$INSTALLER_OUTPUT_DIR/DLC-Manager-$MOD_VERSION-$TARGET_PLATFORM.dmg"
          mount_dir=$(mktemp -d)
          hdiutil verify "$dmg"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"' EXIT
          test -L "$mount_dir/Applications"
          test -x "$mount_dir/DLC Manager.app/Contents/MacOS/DLC Manager"
          test -x "$mount_dir/DLC Manager.app/Contents/runtime/Contents/Home/bin/java"
          codesign --verify --deep --strict --verbose=2 "$mount_dir/DLC Manager.app"
          xcrun stapler validate "$dmg"
          xcrun stapler validate "$INSTALLER_OUTPUT_DIR/DLC-Manager-$MOD_VERSION-$TARGET_PLATFORM.pkg"

      - name: Remove macOS signing credentials
        if: always() && runner.os == 'macOS'
        run: |
          set +x
          cleanup_status=0
          if [[ -n "${MAC_SIGNING_KEYCHAIN:-}" && -f "$MAC_SIGNING_KEYCHAIN" ]]; then
            if ! security delete-keychain "$MAC_SIGNING_KEYCHAIN" > /dev/null 2>&1; then
              echo '::error::Could not remove the temporary signing Keychain.'
              cleanup_status=1
            fi
          fi
          if [[ -n "${MAC_SIGNING_DIR:-}" && "$MAC_SIGNING_DIR" == "$RUNNER_TEMP"/dlcm-signing.* ]]; then
            rm -rf -- "$MAC_SIGNING_DIR"
          fi
          exit "$cleanup_status"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: external-manager-${{ env.MOD_VERSION }}-${{ matrix.platform }}
          path: ${{ env.INSTALLER_OUTPUT_DIR }}/DLC-Manager-${{ env.MOD_VERSION }}-${{ matrix.platform }}.*
          if-no-files-found: error

      - name: Attach installers to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          installers=("$INSTALLER_OUTPUT_DIR/DLC-Manager-$MOD_VERSION-$TARGET_PLATFORM."*)
          gh release upload "$RELEASE_TAG" "${installers[@]}" --clobber
