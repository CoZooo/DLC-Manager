import net.neoforged.gradle.dsl.common.util.DistributionType

plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.+'
}

def commonProject = project(':common')
def neoMcVersion = project.findProperty('mc_version') ?: '1.21.1'
def neoForgeVersion = project.findProperty('neoforge_version') ?: ''
def neoPackFormat = project.findProperty('pack_format')
def mafglibNeoFile = project.findProperty('mafglib_curse_file')

group = mod_group
version = mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java.srcDir commonProject.file('src/main/java')
        resources.srcDir commonProject.file('src/main/resources')
    }
}

repositories {
    mavenCentral()
    maven { url = "https://cursemaven.com" }
}

userDevRuntime {
    create {
        withDistributionType(DistributionType.CLIENT)
        withForgeGroup("net.neoforged")
        withForgeName("neoforge")
        withForgeVersion(neoForgeVersion)
    }
}

dependencies {
    implementation project(':common')
    implementation "net.neoforged:neoforge:${neoForgeVersion}"
    implementation "curse.maven:mafglib-910766:${mafglibNeoFile}"
}

tasks.named('processResources', ProcessResources).configure {
    inputs.properties([
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_author: mod_author,
        mc_version: neoMcVersion,
        neoforge_loader_version_range: project.findProperty('loader_version_range'),
        neoforge_version_range: project.findProperty('version_range'),
        neoforge_minecraft_version_range: project.findProperty('minecraft_version_range'),
        mafglib_version_range: project.findProperty('mafglib_version_range'),
        pack_format: neoPackFormat
    ])
    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_author: mod_author,
            mc_version: neoMcVersion,
            neoforge_loader_version_range: project.findProperty('loader_version_range'),
            neoforge_version_range: project.findProperty('version_range'),
            neoforge_minecraft_version_range: project.findProperty('minecraft_version_range'),
            mafglib_version_range: project.findProperty('mafglib_version_range')
        ])
    }
    filesMatching('pack.mcmeta') {
        expand([
            pack_format: neoPackFormat
        ])
    }
}

def loaderName = project.findProperty("loader_name") ?: "neoforge"

jar {
    archiveFileName.set("DLC-Manager-${loaderName}-${neoMcVersion}-${mod_version}.jar")
    manifest {
        attributes([
            'Specification-Title'     : mod_name,
            'Specification-Vendor'    : mod_author,
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_name,
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : mod_author
        ])
    }
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/CoZooo/DLC-Manager")
            credentials {
                username = System.getenv("USERNAME") ?: (project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR"))
                password = System.getenv("TOKEN") ?: (project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN"))
            }
        }
        maven {
            name = "LocalBuildRepo"
            url = uri("${project.buildDir}/repo")
        }
    }
}
