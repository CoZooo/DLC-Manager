architectury {
    platformSetupLoomIde()
    neoForge()
}

stonecutter {
    constants.match('neoforge', 'fabric', 'forge', 'neoforge')
}

rootProject.configureDlcStonecutterPlatformCommon(project, [
    platformName: 'neoforge',
    commonTransformTaskName: 'transformProductionNeoForge',
    developmentConfigurationName: 'developmentNeoForge'
])

def kotlinSourcesEnabled = project.ext.dlcKotlinSourcesEnabled
def kotlinForForgeVersion = project.kotlin_for_forge_version

configurations {
    kotlinForForgeModDiscovery
}

if (kotlinSourcesEnabled) {
    configurations.runtimeClasspath {
        exclude group: 'org.jetbrains.kotlin'
    }
}

def kotlinForForgeDiscoveryJar = layout.buildDirectory.file("kotlinForForgeModDiscovery/kotlinforforge-neoforge.jar")
def prepareKotlinForForgeModDiscovery = tasks.register('prepareKotlinForForgeModDiscovery', Copy) {
    from(configurations.kotlinForForgeModDiscovery)
    into(kotlinForForgeDiscoveryJar.map { it.asFile.parentFile })
    rename { 'kotlinforforge-neoforge.jar' }
}

if (kotlinSourcesEnabled) {
    tasks.matching {
        it.name == 'generateDLIConfig' || it.name == 'runClient' || it.name == 'runServer'
    }.configureEach {
        dependsOn prepareKotlinForForgeModDiscovery
    }
}

loom {
    mods {
        dlc_manager {
            sourceSet sourceSets.main
        }
        if (kotlinSourcesEnabled) {
            kotlinforforge {
                getModFiles().from(files(kotlinForForgeDiscoveryJar).builtBy(prepareKotlinForForgeModDiscovery))
            }
        }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${project.architectury_api_version}"
    if (kotlinSourcesEnabled) {
        kotlinForForgeModDiscovery("thedarkcolour:kotlinforforge-neoforge:${kotlinForForgeVersion}") {
            transitive = false
        }
        modImplementation("thedarkcolour:kfflang-neoforge:${kotlinForForgeVersion}") {
            transitive = false
        }
        modImplementation("thedarkcolour:kffmod-neoforge:${kotlinForForgeVersion}") {
            transitive = false
        }
    }
    modImplementation "curse.maven:mafglib-910766:${project.mafglib_curse_file}"
    include(implementation("com.cozooo.dlc_manager:dlc-fileops-helper:${file_ops_helper_version}"))
    include(implementation("org.commonmark:commonmark:0.21.0"))
    include(implementation("org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0"))
    forgeRuntimeLibrary "com.cozooo.dlc_manager:dlc-fileops-helper:${file_ops_helper_version}"
    forgeRuntimeLibrary "org.commonmark:commonmark:0.21.0"
    forgeRuntimeLibrary "org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0"

}

processResources {
    def kotlinForForgeDependency = kotlinSourcesEnabled ? """
[[dependencies.${rootProject.mod_id}]]
modId="kotlinforforge"
mandatory=true
versionRange="${project.kotlin_for_forge_version_range}"
ordering="NONE"
side="BOTH"
""" : ""
    inputs.properties([
        mod_id: rootProject.mod_id,
        mod_name: rootProject.mod_name,
        mod_version: rootProject.mod_version,
        mod_author: rootProject.mod_author,
        mc_version: project.minecraft_version,
        neoforge_loader_version_range: project.neoforge_loader_version_range,
        neoforge_version_range: project.neoforge_version_range,
        neoforge_minecraft_version_range: project.neoforge_minecraft_version_range,
        kotlin_for_forge_dependency: kotlinForForgeDependency,
        mafglib_version_range: project.mafglib_version_range,
        pack_format: project.pack_format
    ])

    doLast { task ->
        rootProject.expandProcessedResource(task, 'META-INF/neoforge.mods.toml', [
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_version: rootProject.mod_version,
            mod_author: rootProject.mod_author,
            mc_version: project.minecraft_version,
            neoforge_loader_version_range: project.neoforge_loader_version_range,
            neoforge_version_range: project.neoforge_version_range,
            neoforge_minecraft_version_range: project.neoforge_minecraft_version_range,
            kotlin_for_forge_dependency: kotlinForForgeDependency,
            mafglib_version_range: project.mafglib_version_range
        ])
        rootProject.expandProcessedResource(task, 'pack.mcmeta', [pack_format: project.pack_format])
    }
}
