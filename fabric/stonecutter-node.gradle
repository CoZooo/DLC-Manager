architectury {
    platformSetupLoomIde()
    fabric()
}

stonecutter {
    constants.match('fabric', 'fabric', 'forge', 'neoforge')
}

rootProject.configureDlcStonecutterPlatformCommon(project, [
    platformName: 'fabric',
    commonTransformTaskName: 'transformProductionFabric',
    includeCommonResources: true,
    developmentConfigurationName: 'developmentFabric',
    includeFabricObfLib: true
])

def kotlinSourcesEnabled = project.ext.dlcKotlinSourcesEnabled

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "dev.architectury:architectury-fabric:${project.architectury_api_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    if (kotlinSourcesEnabled) {
        modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"
    }
    obfLib "net.fabricmc:intermediary:${project.minecraft_version}:v2"
    modImplementation "maven.modrinth:malilib:${project.malilib_version}"
    if (project.modmenu_version) {
        modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    }
    include(implementation("com.cozooo.dlc_manager:dlc-fileops-helper:${file_ops_helper_version}"))
    include(implementation("org.commonmark:commonmark:0.21.0"))
    include(implementation("org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0"))

}

processResources {
    inputs.properties([
        mod_id: rootProject.mod_id,
        mod_name: rootProject.mod_name,
        mod_version: rootProject.mod_version,
        mod_author: rootProject.mod_author,
        mc_version: project.minecraft_version,
        mc_version_range: project.minecraft_version_range,
        fabric_loader_version: project.fabric_loader_version,
        fabric_api_version: project.fabric_api_version,
        fabric_api_version_range: project.fabric_api_version_range,
        enable_kotlin: kotlinSourcesEnabled,
        fabric_language_kotlin_version: project.fabric_language_kotlin_version,
        malilib_version: project.malilib_version,
        pack_format: project.pack_format
    ])

    doLast { task ->
        rootProject.expandProcessedFabricModJson(task, [
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_version: rootProject.mod_version,
            mod_author: rootProject.mod_author,
            mc_version: project.minecraft_version,
            mc_version_range: project.minecraft_version_range,
            fabric_loader_version: project.fabric_loader_version,
            fabric_api_version: project.fabric_api_version,
            fabric_api_version_range: project.fabric_api_version_range,
            malilib_version: project.malilib_version,
            pack_format: project.pack_format
        ], kotlinSourcesEnabled, project.fabric_language_kotlin_version)
        rootProject.expandProcessedResource(task, 'pack.mcmeta', [pack_format: project.pack_format])
    }
}
