rootProject.configureDlcStonecutterBase(project)

def commonProjectPath = ":common:${project.name}"
def commonProject = project(commonProjectPath)
def commonJar = commonProject.tasks.named('jar').flatMap { it.archiveFile }
def commonFabricJar = commonProject.tasks.named('transformProductionFabric').flatMap { it.archiveFile }
def kotlinSourcesEnabled = rootProject.architecturyBooleanProperty(project, 'enable_kotlin', false)
    && plugins.hasPlugin('org.jetbrains.kotlin.jvm')

architectury {
    platformSetupLoomIde()
    fabric()
}

rootProject.configureDlcStonecutterSources(project, true)
rootProject.configureLocalDevMods(project)
rootProject.configureServerRunClientOnlyModExcludes(project, commonProjectPath)

def withoutOwnDevJar = { File file ->
    !file.toPath().startsWith(layout.buildDirectory.dir('devlibs').get().asFile.toPath())
}

tasks.named('compileJava').configure {
    classpath = classpath.filter(withoutOwnDevJar)
}

if (tasks.findByName('compileKotlin') != null) {
    tasks.named('compileKotlin').configure {
        libraries.setFrom(libraries.filter(withoutOwnDevJar))
    }
}

afterEvaluate {
    tasks.named('compileJava').configure {
        setDependsOn(dependsOn.findAll { it != tasks.named('jar').get() })
    }
    if (tasks.findByName('compileKotlin') != null) {
        tasks.named('compileKotlin').configure {
            setDependsOn(dependsOn.findAll { it != tasks.named('jar').get() })
        }
    }
}

configurations {
    common
    shadowCommon
    obfLib
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "dev.architectury:architectury-fabric:${project.architectury_api_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    if (kotlinSourcesEnabled) {
        modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"
    }
    obfLib "net.fabricmc:intermediary:${project.minecraft_version}:v2"
    modImplementation "maven.modrinth:malilib:${project.malilib_version}"
    if (project.modmenu_version) {
        modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    }
    include(implementation("com.cozooo.dlc_manager:dlc-fileops-helper:${file_ops_helper_version}"))
    include(implementation("org.commonmark:commonmark:0.21.0"))
    include(implementation("org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0"))

    common(files(commonJar).builtBy(commonProject.tasks.named('jar')))
    shadowCommon(files(commonFabricJar).builtBy(commonProject.tasks.named('transformProductionFabric')))
}

processResources {
    inputs.properties([
        mod_id: rootProject.mod_id,
        mod_name: rootProject.mod_name,
        mod_version: rootProject.mod_version,
        mod_author: rootProject.mod_author,
        mc_version: project.minecraft_version,
        mc_version_range: project.minecraft_version_range,
        fabric_loader_version: project.fabric_loader_version,
        fabric_api_version: project.fabric_api_version,
        fabric_api_version_range: project.fabric_api_version_range,
        enable_kotlin: kotlinSourcesEnabled,
        fabric_language_kotlin_version: project.fabric_language_kotlin_version,
        malilib_version: project.malilib_version,
        pack_format: project.pack_format
    ])

    doLast { task ->
        rootProject.expandProcessedFabricModJson(task, [
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_version: rootProject.mod_version,
            mod_author: rootProject.mod_author,
            mc_version: project.minecraft_version,
            mc_version_range: project.minecraft_version_range,
            fabric_loader_version: project.fabric_loader_version,
            fabric_api_version: project.fabric_api_version,
            fabric_api_version_range: project.fabric_api_version_range,
            malilib_version: project.malilib_version,
            pack_format: project.pack_format
        ], kotlinSourcesEnabled, project.fabric_language_kotlin_version)
        rootProject.expandProcessedResource(task, 'pack.mcmeta', [pack_format: project.pack_format])
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile = shadowJar.archiveFile
    dependsOn shadowJar
    archiveFileName.set("DLC-Manager-fabric-${project.minecraft_version}-${rootProject.mod_version}.jar")
    destinationDirectory.set(rootProject.layout.projectDirectory.dir("output/${rootProject.findProperty('mod_version') ?: '0.0.0'}"))
}

jar {
    archiveClassifier = 'dev'
}

tasks.register('exportObfClasspath', Sync) {
    dependsOn("${commonProjectPath}:jar")
    from({
        def jars = [] as LinkedHashSet<File>
        [configurations.compileClasspath, configurations.runtimeClasspath].each { cfg ->
            jars.addAll(cfg.resolve().findAll { it.name.endsWith('.jar') })
        }
        jars.addAll(configurations.obfLib.resolve().findAll { it.name.endsWith('.jar') })
        jars
    })
    into rootProject.layout.projectDirectory.dir("obf-lib/fabric-${project.minecraft_version}")
}
