plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

def commonProject = project(':common')

def mcVersion = project.findProperty('mc_version') ?: '1.20.1'

def loaderName = project.findProperty('loader_name') ?: 'fabric'

def fabricLoaderVersion = project.findProperty('fabric_loader_version') ?: '0.15.11'

def fabricApiVersion = project.findProperty('fabric_api_version') ?: '0.92.2+1.20.1'

def malilibVersion = project.findProperty('malilib_version') ?: '0.16.1'

def modmenuVersion = project.findProperty('modmenu_version') ?: ''

def packFormat = project.findProperty('pack_format')

group = mod_group
version = mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java.srcDir commonProject.file('src/main/java')
        resources.srcDir commonProject.file('src/main/resources')
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.terraformersmc.com' }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    modCompileOnly "maven.modrinth:malilib:${malilibVersion}"
    if (modmenuVersion) {
        modCompileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
    }

    implementation project(':common')
}

tasks.named('processResources', ProcessResources).configure {
    inputs.properties([
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_author: mod_author,
        mc_version: mcVersion,
        fabric_loader_version: fabricLoaderVersion,
        fabric_api_version: fabricApiVersion,
        malilib_version: malilibVersion,
        pack_format: packFormat
    ])
    filesMatching('fabric.mod.json') {
        expand([
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_author: mod_author,
            mc_version: mcVersion,
            fabric_loader_version: fabricLoaderVersion,
            fabric_api_version: fabricApiVersion,
            malilib_version: malilibVersion
        ])
    }
    filesMatching('pack.mcmeta') {
        expand([
            pack_format: packFormat
        ])
    }
}

jar {
    archiveFileName.set("DLC-Manager-${loaderName}-${mcVersion}-${mod_version}.jar")
}

tasks.named('remapJar') {
    archiveFileName.set("DLC-Manager-${loaderName}-${mcVersion}-${mod_version}.jar")
    destinationDirectory.set(rootProject.layout.projectDirectory.dir("../output/${rootProject.findProperty('mod_version') ?: '0.0.0'}"))
}

tasks.named('build') {
    dependsOn tasks.named('remapJar')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${loaderName}-${mcVersion}"
            artifact tasks.named('remapJar')
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/CoZooo/DLC-Manager")
            credentials {
                username = System.getenv("USERNAME") ?: (project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR"))
                password = System.getenv("TOKEN") ?: (project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN"))
            }
        }
        maven {
            name = "LocalBuildRepo"
            url = uri("${project.buildDir}/repo")
        }
    }
}
