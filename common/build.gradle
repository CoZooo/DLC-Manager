plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    api "com.google.code.gson:gson:2.10.1"
    api "de.marhali:json5-java:3.0.0"
    api "org.commonmark:commonmark:0.21.0"
    api "org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0"
}
