plugins {
    id 'base'
}

tasks.register('compileKotlin') {
    group = 'build'
    description = 'Compile common Kotlin sources for all Architectury versions.'
    dependsOn(gradle.includedBuild('arch1201').task(':common:compileKotlin'))
    dependsOn(gradle.includedBuild('arch1211').task(':common:compileKotlin'))
}

tasks.register('compileJava') {
    group = 'build'
    description = 'Compile common Java sources for all Architectury versions.'
    dependsOn(gradle.includedBuild('arch1201').task(':common:compileJava'))
    dependsOn(gradle.includedBuild('arch1211').task(':common:compileJava'))
}

tasks.register('classes') {
    group = 'build'
    description = 'Assemble common classes for all Architectury versions.'
    dependsOn(tasks.named('compileKotlin'))
    dependsOn(tasks.named('compileJava'))
}

tasks.register('test') {
    group = 'verification'
    description = 'Run common tests for all Architectury versions.'
    dependsOn(gradle.includedBuild('arch1201').task(':common:test'))
    dependsOn(gradle.includedBuild('arch1211').task(':common:test'))
}

tasks.named('check') {
    group = 'verification'
    description = 'Run common checks for all Architectury versions.'
    dependsOn(gradle.includedBuild('arch1201').task(':common:check'))
    dependsOn(gradle.includedBuild('arch1211').task(':common:check'))
}

tasks.named('assemble') {
    dependsOn(tasks.named('classes'))
}

tasks.named('build') {
    dependsOn(tasks.named('check'))
}
