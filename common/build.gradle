plugins {
    id 'base'
}

def kotlinEnabled = (findProperty('enable_kotlin') ?: 'false').toString().toBoolean()
def versionProjects = ['1.20.1', '1.21.1']

tasks.register('compileKotlin') {
    group = 'build'
    description = 'Compile common Kotlin sources for all Stonecutter versions.'
    if (kotlinEnabled) {
        dependsOn(versionProjects.collect { ":common:${it}:compileKotlin" })
    }
}

tasks.register('compileJava') {
    group = 'build'
    description = 'Compile common Java sources for all Stonecutter versions.'
    dependsOn(versionProjects.collect { ":common:${it}:compileJava" })
}

tasks.register('classes') {
    group = 'build'
    description = 'Assemble common classes for all Stonecutter versions.'
    if (kotlinEnabled) {
        dependsOn(tasks.named('compileKotlin'))
    }
    dependsOn(tasks.named('compileJava'))
}

tasks.register('test') {
    group = 'verification'
    description = 'Run common tests for all Stonecutter versions.'
    dependsOn(versionProjects.collect { ":common:${it}:test" })
}

tasks.named('check') {
    group = 'verification'
    description = 'Run common checks for all Stonecutter versions.'
    dependsOn(versionProjects.collect { ":common:${it}:check" })
}

tasks.named('assemble') {
    dependsOn(tasks.named('classes'))
}

tasks.named('build') {
    dependsOn(tasks.named('check'))
}
