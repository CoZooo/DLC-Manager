rootProject.configureDlcStonecutterBase(project)

architectury {
    common(project.enabled_platforms.split(','))
}

rootProject.configureDlcStonecutterSources(project)

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "dev.architectury:architectury:${project.architectury_api_version}"
    modImplementation "maven.modrinth:malilib:${project.malilib_version}"

    implementation "com.google.code.gson:gson:${project.gson_version}"
    implementation "org.commonmark:commonmark:0.21.0"
    implementation "org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0"
    implementation "com.cozooo.dlc_manager:dlc-fileops-helper:${file_ops_helper_version}"
}
