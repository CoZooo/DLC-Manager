plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

def HELPER_MOD_ID = 'dlc_fileops_helper'
def HELPER_MOD_NAME = 'DLC FileOps Helper'
def HELPER_MOD_GROUP = 'com.cozooo.dlc_manager'
def HELPER_MOD_AUTHOR = 'CoZooo'

group = HELPER_MOD_GROUP
version = providers.gradleProperty('mod_version').get()
description = HELPER_MOD_NAME

base {
    archivesName = 'dlc-fileops-helper'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java.srcDirs = ['common/src/main/java']
        resources.srcDirs = ['common/src/main/resources']
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "com.google.code.gson:gson:2.10.1"
    compileOnly "org.slf4j:slf4j-api:2.0.13"
}

tasks.register('helperBuild') {
    group = 'build'
    dependsOn(tasks.named('build'))
}

tasks.register('helperCheck') {
    group = 'verification'
    dependsOn(tasks.named('check'))
}

tasks.register('helperClean') {
    group = 'build'
    dependsOn(tasks.named('clean'))
}

tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title': HELPER_MOD_NAME,
            'Implementation-Version': project.version,
            'Implementation-Vendor': HELPER_MOD_AUTHOR,
            'DLC-Helper-Mod-Id': HELPER_MOD_ID,
        )
    }
}

tasks.withType(org.gradle.jvm.tasks.Jar).configureEach {
    from(layout.projectDirectory.file('../../LICENSE')) {
        into('META-INF')
    }
}

mavenPublishing {
    coordinates(HELPER_MOD_GROUP, 'dlc_fileops_helper', providers.gradleProperty('mod_version').get())

    publishToMavenCentral()
    signAllPublications()

    pom {
        name = HELPER_MOD_NAME
        description = 'File operation helper for DLC Manager.'
        url = 'https://github.com/CoZooo/DLC-Manager'
        licenses {
            license {
                name = 'PolyForm Shield License 1.0.0'
                url = 'https://polyformproject.org/licenses/shield/1.0.0'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = HELPER_MOD_AUTHOR
                name = HELPER_MOD_AUTHOR
            }
        }
        scm {
            connection = 'scm:git:git://github.com/CoZooo/DLC-Manager.git'
            developerConnection = 'scm:git:ssh://git@github.com/CoZooo/DLC-Manager.git'
            url = 'https://github.com/CoZooo/DLC-Manager'
        }
    }
}
