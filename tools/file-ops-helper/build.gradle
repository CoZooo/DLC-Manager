plugins {
    id 'java-library'
    id 'maven-publish'
}

def HELPER_MOD_ID = 'dlc_fileops_helper'
def HELPER_MOD_NAME = 'DLC FileOps Helper'
def HELPER_MOD_GROUP = 'com.cozooo.dlc_manager'
def HELPER_MOD_AUTHOR = 'CoZooo'

group = HELPER_MOD_GROUP
version = providers.gradleProperty('mod_version').get()
description = HELPER_MOD_NAME

base {
    archivesName = 'dlc-fileops-helper'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java.srcDirs = ['common/src/main/java']
        resources.srcDirs = ['common/src/main/resources']
    }
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://maven.cozozjw.cn/repository/maven-public/')
    }
}

dependencies {
    implementation "com.google.code.gson:gson:2.10.1"
    compileOnly "org.slf4j:slf4j-api:2.0.13"
}

tasks.register('helperBuild') {
    group = 'build'
    dependsOn(tasks.named('build'))
}

tasks.register('helperCheck') {
    group = 'verification'
    dependsOn(tasks.named('check'))
}

tasks.register('helperClean') {
    group = 'build'
    dependsOn(tasks.named('clean'))
}

tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title': HELPER_MOD_NAME,
            'Implementation-Version': project.version,
            'Implementation-Vendor': HELPER_MOD_AUTHOR,
            'DLC-Helper-Mod-Id': HELPER_MOD_ID,
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'dlc-fileops-helper'
            version = project.version
            pom {
                name = HELPER_MOD_NAME
                developers {
                    developer {
                        id = HELPER_MOD_AUTHOR
                        name = HELPER_MOD_AUTHOR
                    }
                }
            }
        }
    }

    repositories {
        def mavenUsername = findProperty('mavenUsername') ?: System.getenv('MAVEN_USERNAME')
        def mavenPassword = findProperty('mavenPassword') ?: System.getenv('MAVEN_PASSWORD')
        if (mavenUsername && mavenPassword) {
            maven {
                name = 'CozoooNexus'
                url = uri('https://maven.cozozjw.cn/repository/maven-releases/')
                credentials {
                    username = mavenUsername
                    password = mavenPassword
                }
            }
        }
    }
}
