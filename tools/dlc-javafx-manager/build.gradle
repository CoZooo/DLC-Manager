plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

def rootGradleProperty = { String key ->
    def value = findProperty(key)
    if (value != null) {
        return value
    }
    def rootPropsFile = file('../../gradle.properties')
    if (rootPropsFile.exists()) {
        def rootProps = new Properties()
        rootPropsFile.withInputStream { rootProps.load(it) }
        return rootProps.getProperty(key)
    }
    return null
}

def fileOpsHelperVersion = (rootGradleProperty('file_ops_helper_version') ?: '').toString()
def appVersion = (rootGradleProperty('mod_version') ?: '0.0.0').toString()
fileOpsHelperVersion = (fileOpsHelperVersion ?: '').toString()
version = appVersion

